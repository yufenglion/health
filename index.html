
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="減重紀錄">
<meta name="theme-color" content="#E9EEF0">
<title>減重紀錄</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#E9EEF0; --card:#FFF; --ink:#16232B; --mut:#6E8088; --line:#D3DCE0;
    --water:#1B7A8C; --prot:#C0821A; --kcal:#5A4B87; --fib:#4A7C3F; --shot:#B5503C;
    --cn:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  }
  body{margin:0;padding:14px 12px 40px;background:var(--bg);color:var(--ink);
       font-family:var(--cn);font-size:15px;line-height:1.5;max-width:560px;margin-inline:auto}
  .num{font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.02em}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;
        box-shadow:0 1px 2px rgba(22,35,43,.07)}
  h2{font-size:11px;letter-spacing:.16em;color:var(--mut);margin:0 0 10px;font-weight:700}

  /* date bar */
  .dbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .dbar b{font-size:19px;font-weight:800}
  .dbar span{font-size:12px;color:var(--mut);margin-left:6px;font-weight:400}
  .nav{border:1px solid var(--line);background:var(--card);color:var(--ink);
       width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
  .nav:disabled{opacity:.3}

  /* water signature */
  .wtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .wtop .num{font-size:38px;color:var(--water);line-height:1}
  .wtop em{font-style:normal;font-size:13px;color:var(--mut)}
  .bottles{display:flex;gap:8px;align-items:flex-end;margin-bottom:14px}
  .btl{flex:1;position:relative}
  .btl svg{display:block;width:100%}
  .btl i{position:absolute;bottom:-16px;left:0;right:0;text-align:center;
         font-style:normal;font-size:9px;color:var(--mut)}
  .wbtns{display:flex;gap:6px;margin-top:22px}
  .wbtns button{flex:1;padding:11px 0;border-radius:10px;border:0;cursor:pointer;
                background:var(--water);color:#fff;font-family:var(--cn);font-size:14px;font-weight:700}
  .wbtns button.gh{background:#EBF2F4;color:var(--water)}

  /* bars */
  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .rhd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .rhd b{font-size:13px;font-weight:700}
  .rhd .v{font-size:13px;color:var(--mut)}
  .rhd .v s{text-decoration:none;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .track{height:9px;border-radius:5px;background:#EDF1F2;overflow:hidden;position:relative}
  .fill{height:100%;border-radius:5px;transition:width .35s ease}
  .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:rgba(22,35,43,.28)}

  /* chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;
        font-size:13px;font-family:var(--cn);color:var(--ink);cursor:pointer}
  .chip:active{background:#EDF1F2}
  .chip u{text-decoration:none;color:var(--mut);font-size:11px;margin-left:5px}
  .gl{font-size:11px;color:var(--mut);margin:12px 0 6px;font-weight:700}
  .gl:first-child{margin-top:0}

  /* list */
  .item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EFF3F4;font-size:14px}
  .item:last-child{border:0}
  .item .nm{flex:1}
  .item .mt{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  .del{border:0;background:none;color:#B0BEC4;font-size:17px;cursor:pointer;padding:0 2px}
  .empty{color:var(--mut);font-size:13px;padding:4px 0}

  /* habits */
  .habs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hab{display:flex;align-items:center;gap:8px;padding:11px 10px;border:1px solid var(--line);
       border-radius:10px;font-size:13px;cursor:pointer;background:#fff}
  .hab.on{background:#F0F6F1;border-color:#BBD6BE}
  .box{width:17px;height:17px;border-radius:5px;border:1.5px solid #BCC8CD;flex:none;
       display:grid;place-items:center;font-size:11px;color:#fff}
  .hab.on .box{background:var(--fib);border-color:var(--fib)}

  /* injection */
  .shot{border-left:3px solid var(--shot)}
  .shot.on{background:#FDF4F2}
  .srow{display:flex;align-items:center;gap:10px}
  .srow .lb{flex:1}
  .srow .lb b{font-size:14px;font-weight:700;display:block}
  .srow .lb u{text-decoration:none;font-size:11px;color:var(--mut)}
  .tog{border:1.5px solid var(--shot);background:#fff;color:var(--shot);border-radius:20px;
       padding:8px 14px;font-family:var(--cn);font-size:13px;font-weight:700;cursor:pointer;flex:none}
  .tog.on{background:var(--shot);color:#fff}
  .hint{margin-top:11px;padding:9px 11px;background:#FBF1EE;border-radius:9px;
        font-size:12px;line-height:1.6;color:#7A4232}
  .hint.calm{background:#F0F5F1;color:#3F6142}
  .dose{display:flex;gap:6px;margin-top:11px}
  .dose button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 0;
       font-family:var(--cn);font-size:12px;color:var(--mut);cursor:pointer;font-variant-numeric:tabular-nums}
  .dose button.on{border-color:var(--shot);color:var(--shot);font-weight:700;background:#FDF4F2}
  .sxs{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .sx{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;
      font-size:12px;font-family:var(--cn);color:var(--mut);cursor:pointer}
  .sx.on{border-color:var(--shot);background:#FDF4F2;color:var(--shot);font-weight:700}
  .pill{background:var(--shot);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;
        border-radius:20px;margin-left:7px;vertical-align:middle}

  /* inputs */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
  input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
        font-family:var(--cn);font-size:15px;background:#fff;color:var(--ink)}
  .save{width:100%;padding:11px;border:0;border-radius:10px;background:var(--ink);color:#fff;
        font-family:var(--cn);font-size:14px;font-weight:700;cursor:pointer}
  .logs{margin-top:12px;font-size:13px}
  .lg{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #EFF3F4;font-variant-numeric:tabular-nums}
  .lg:last-child{border:0}
  .lg .d{color:var(--mut);width:52px;flex:none}
  .lg .dl{color:#B0BEC4;font-size:11px}
  .bkp{display:flex;gap:8px}
  .bkp button{flex:1;padding:11px 0;border:0;border-radius:10px;background:var(--ink);color:#fff;
              font-family:var(--cn);font-size:14px;font-weight:700;cursor:pointer}
  .bkp button.gh{background:#EDF1F2;color:var(--ink)}
  .note{font-size:11px;color:var(--mut);line-height:1.6;margin-top:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="dbar">
  <button class="nav" id="prev">‹</button>
  <div><b id="dlab"></b><span id="dsub"></span></div>
  <button class="nav" id="next">›</button>
</div>

<div class="card shot" id="scard"></div>

<div class="card">
  <div class="wtop">
    <div><span class="num" id="wml">0</span> <em>/ 2,100 ml</em></div>
    <em id="wpct" style="font-style:normal;font-size:12px;color:var(--mut)"></em>
  </div>
  <div class="bottles" id="btls"></div>
  <div class="wbtns">
    <button data-w="150">+150</button>
    <button data-w="300">+300</button>
    <button data-w="600">+600</button>
    <button class="gh" id="wundo">復原</button>
  </div>
</div>

<div class="card" id="bars"></div>

<div class="card">
  <h2>快速加入</h2>
  <div id="foods"></div>
  <div class="gl" style="margin-top:14px">自訂</div>
  <div class="grid" style="grid-template-columns:1.4fr 1fr 1fr">
    <div><label>名稱</label><input id="cn" placeholder="例：滷味"></div>
    <div><label>熱量</label><input id="ck" inputmode="numeric" placeholder="kcal"></div>
    <div><label>蛋白</label><input id="cp" inputmode="numeric" placeholder="g"></div>
  </div>
  <button class="save" id="cadd">加入</button>
</div>

<div class="card">
  <h2>今天吃了</h2>
  <div id="list"></div>
</div>

<div class="card">
  <h2>今天做到</h2>
  <div class="habs" id="habs"></div>
</div>

<div class="card">
  <h2>每週紀錄</h2>
  <div class="grid">
    <div><label>體重 kg</label><input id="mw" inputmode="decimal" placeholder="73.4"></div>
    <div><label>腰圍 cm</label><input id="ms" inputmode="decimal" placeholder="96.3"></div>
    <div><label>體脂 %（每4週）</label><input id="mf" inputmode="decimal" placeholder="46.3"></div>
    <div><label>骨骼肌 kg（每4週）</label><input id="mm" inputmode="decimal" placeholder="21.4"></div>
  </div>
  <button class="save" id="msave">儲存這次量測</button>
  <div class="logs" id="mlogs"></div>
  <p class="note">同一時間、同樣條件量最準（建議起床上完廁所、空腹）。體重、腰圍每週一次；體脂與骨骼肌每 4 週一次就好。</p>
</div>

<div class="card">
  <h2>備份</h2>
  <p class="note" style="margin:0 0 11px" id="smode"></p>
  <div class="bkp">
    <button id="exp">匯出備份檔</button>
    <button id="imp" class="gh">匯入備份檔</button>
  </div>
  <input type="file" id="fin" accept=".json,application/json" style="display:none">
  <p class="note" id="bmsg"></p>
</div>

<p class="note" style="text-align:center;padding:0 6px">食物數值為常見市售品項的估算值，用來抓趨勢而非精算。用藥、劑量與抽血追蹤請依你的醫師指示。</p>

<script>
const TGT={water:2100,kcal:[1250,1400],prot:[80,100],fib:25};
const BOTTLES=[600,600,600,300];
const FOODS=[
 ["飲品",[["無糖拿鐵 大杯",150,8,0],["無糖豆漿 400ml",130,12,1.5],["無糖茶／每朝",0,0,0],["無糖優格 1杯",100,15,0],["黑咖啡",5,0,0]]],
 ["蛋白質",[["茶葉蛋／水煮蛋 1顆",75,7,0],["雞胸肉 100g",165,31,0],["去皮雞腿 100g",155,24,0],["鮭魚 100g",200,22,0],["白肉魚 150g",165,30,0],["蝦仁 100g",100,20,0],["瘦牛肉 100g",180,26,0],["豆腐 半盒",110,12,1]]],
 ["澱粉",[["白飯 半碗",140,2.5,0.5],["白飯 一碗",280,5,1],["小地瓜 1條",90,1.5,2.5],["全麥吐司 1片",80,3,2],["玉米 半根",60,2,2],["冬粉 半份",90,0.5,0.5]]],
 ["蔬果",[["青菜 1大碗",50,3,4],["菇類 1碗",30,3,3],["番茄 1顆",25,1,1.5],["水果 1份",60,0.5,2],["生菜沙拉",40,2,3]]],
 ["外食組合",[["21世紀雞腿（不含飯）",350,30,0],["蛋餅 1份",250,9,1],["便當 烤雞＋青菜",480,32,4],["蔬菜火鍋（少量肉）",380,28,7]]]
];
const HABITS=[["walk","走路 20 分以上"],["lift","肌力訓練"],["sleep","睡足 7 小時"],["night","沒吃宵夜甜飲"]];
const DOSES=["0.25","0.5","1.0","1.7","2.4"];
const SX=["噁心","胃脹","便祕","腹瀉","沒胃口","都還好"];

/* 儲存：優先用 Claude 儲存，本機開檔時退回 localStorage，兩者都不行才用記憶體 */
const MEM={};
let MODE='memory';
const LS=(()=>{try{localStorage.setItem('wl:t','1');localStorage.removeItem('wl:t');return localStorage}catch(e){return null}})();
const S={
  async get(k){
    try{const r=await window.storage.get(k);MODE='cloud';return r?JSON.parse(r.value):null}catch(e){}
    if(LS){MODE=MODE==='cloud'?MODE:'local';const v=LS.getItem(k);return v?JSON.parse(v):null}
    return MEM[k]??null},
  async set(k,v){
    MEM[k]=v;
    try{await window.storage.set(k,JSON.stringify(v));MODE='cloud';return}catch(e){}
    if(LS){LS.setItem(k,JSON.stringify(v));MODE='local'}},
  async keys(){
    try{const r=await window.storage.list('wl:');if(r)return r.keys}catch(e){}
    if(LS)return Object.keys(LS).filter(k=>k.startsWith('wl:'));
    return Object.keys(MEM)}
};
let cur=new Date(), day=null, logs=[];
const key=d=>'wl:'+d.toISOString().slice(0,10);
const isoToday=new Date().toISOString().slice(0,10);

let shots=[];
function blank(){return{water:[],items:[],habits:{},sx:[]}}
async function load(){
  day=await S.get(key(cur))||blank();
  if(!day.sx)day.sx=[];
  logs=await S.get('wl:measures')||[];
  shots=await S.get('wl:shots')||[];
  render();
}
function findShot(iso){return shots.find(s=>s.d===iso)}
function lastShotBefore(iso){
  return shots.filter(s=>s.d<=iso).sort((a,b)=>b.d.localeCompare(a.d))[0];
}
function dayGap(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

function renderShot(iso){
  const mine=findShot(iso), last=lastShotBefore(iso);
  const gap=last?dayGap(last.d,iso):null;
  scard.classList.toggle('on',!!mine);
  let hint='';
  if(mine){
    hint=`<div class="hint">打針當天通常還算舒服，副作用多半在接下來 1～2 天。今天正常吃、正常走就好。</div>
      <div class="dose">${DOSES.map(d=>`<button data-dose="${d}" class="${mine.dose===d?'on':''}">${d} mg</button>`).join('')}</div>`;
  }else if(gap===1||gap===2){
    hint=`<div class="hint">打針後第 ${gap} 天 —— 腸胃反應常在這兩天最明顯。不舒服就把運動改成散步，優先補水和蛋白質。</div>`;
  }else if(gap===6){
    hint=`<div class="hint calm">距離上次打針 6 天，明天大概是下一針。針具記得先從冰箱拿出來回溫。</div>`;
  }else if(gap!==null&&gap>7){
    hint=`<div class="hint">距離上次打針已經 ${gap} 天，超過一週了。要不要確認一下是不是漏打？</div>`;
  }
  scard.innerHTML=`<div class="srow"><div class="lb">
      <b>💉 Wegovy${mine?`<span class="pill">${mine.dose} mg</span>`:''}</b>
      <u>${mine?'今天已記錄':(last?`上次 ${last.d.slice(5)}・${last.dose} mg`:'還沒有任何紀錄')}</u></div>
    <button class="tog ${mine?'on':''}" id="stog">${mine?'取消':'今天打了'}</button></div>
    ${hint}
    ${(mine||gap===1||gap===2)?`<div class="sxs">${SX.map(s=>`<span class="sx ${day.sx.includes(s)?'on':''}" data-sx="${s}">${s}</span>`).join('')}</div>`:''}`;
}
function sum(f){return day.items.reduce((a,i)=>a+i[f],0)}

function bottleSVG(cap,filled){
  const h=Math.round(46*cap/600)+14, lvl=Math.max(0,Math.min(1,filled/cap));
  const bodyTop=10, bodyH=h-bodyTop, fh=bodyH*lvl;
  return `<svg viewBox="0 0 30 ${h+2}" aria-hidden="true">
   <rect x="11" y="0" width="8" height="6" rx="1.5" fill="#C6D2D7"/>
   <path d="M9 ${bodyTop} q6-4 12 0 v${bodyH-4} q0 4-4 4 h-4 q-4 0-4-4z" fill="#F1F5F6"/>
   <clipPath id="c${cap}${filled}"><path d="M9 ${bodyTop} q6-4 12 0 v${bodyH-4} q0 4-4 4 h-4 q-4 0-4-4z"/></clipPath>
   <rect x="0" y="${bodyTop+bodyH-fh}" width="30" height="${fh}" fill="var(--water)" clip-path="url(#c${cap}${filled})"/>
  </svg>`;
}

function bar(lab,val,fill,lo,hi,unit,color){
  const max=hi*1.15, w=Math.min(100,val/max*100), g=lo/max*100;
  return `<div class="row"><div class="rhd"><b>${lab}</b>
    <span class="v"><s style="color:${color}">${val}</s> / ${lo===hi?hi:lo+'–'+hi} ${unit}</span></div>
    <div class="track"><div class="fill" style="width:${w}%;background:${color}"></div>
    <div class="goal" style="left:${g}%"></div></div></div>`;
}

function render(){
  const D=['日','一','二','三','四','五','六'][cur.getDay()];
  const iso=cur.toISOString().slice(0,10);
  dlab.textContent=`${cur.getMonth()+1}/${cur.getDate()}`;
  dsub.textContent=(iso===isoToday?`週${D}・今天`:`週${D}`)+(findShot(iso)?'　💉':'');
  next.disabled=iso>=isoToday;
  renderShot(iso);

  const w=day.water.reduce((a,b)=>a+b,0);
  wml.textContent=w.toLocaleString();
  wpct.textContent=Math.round(w/TGT.water*100)+'%';
  let rest=w;
  btls.innerHTML=BOTTLES.map(c=>{const f=Math.min(c,Math.max(0,rest));rest-=f;
    return `<div class="btl">${bottleSVG(c,f)}<i>${c}</i></div>`}).join('');

  bars.innerHTML=bar('蛋白質',+sum(2).toFixed(1),0,TGT.prot[0],TGT.prot[1],'g','var(--prot)')
    +bar('熱量',Math.round(sum(1)),0,TGT.kcal[0],TGT.kcal[1],'kcal','var(--kcal)')
    +bar('纖維',+sum(3).toFixed(1),0,TGT.fib,TGT.fib,'g','var(--fib)');

  foods.innerHTML=FOODS.map(([g,its])=>`<div class="gl">${g}</div><div class="chips">`+
    its.map(f=>`<button class="chip" data-f='${JSON.stringify(f)}'>${f[0]}<u>${f[1]}k・${f[2]}p</u></button>`).join('')
    +`</div>`).join('');

  list.innerHTML=day.items.length?day.items.map((it,i)=>
    `<div class="item"><span class="nm">${it[0]}</span>
     <span class="mt">${Math.round(it[1])} kcal・${it[2]}g</span>
     <button class="del" data-i="${i}">✕</button></div>`).join('')
    :`<div class="empty">還沒記錄。上面點一下就好。</div>`;

  habs.innerHTML=HABITS.map(([k,l])=>
    `<div class="hab ${day.habits[k]?'on':''}" data-h="${k}"><span class="box">✓</span>${l}</div>`).join('');

  mlogs.innerHTML=logs.length?logs.slice(0,8).map((m,i)=>
    `<div class="lg"><span class="d">${m.d.slice(5)}</span>
     <span>${m.w?m.w+' kg':''} ${m.s?'　'+m.s+' cm':''} ${m.f?'　體脂 '+m.f+'%':''} ${m.m?'　肌 '+m.m:''}</span>
     <button class="del dl" data-m="${i}">✕</button></div>`).join(''):'';
}

async function save(){await S.set(key(cur),day);render()}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,.hab,.sx'); if(!t)return;
  const iso=cur.toISOString().slice(0,10);
  if(t.id==='stog'){
    const i=shots.findIndex(s=>s.d===iso);
    if(i>=0)shots.splice(i,1); else shots.push({d:iso,dose:(lastShotBefore(iso)||{dose:'0.25'}).dose});
    await S.set('wl:shots',shots);render();return}
  if(t.dataset.dose){const s=findShot(iso);if(s){s.dose=t.dataset.dose;await S.set('wl:shots',shots);render()}return}
  if(t.dataset.sx){const s=t.dataset.sx;
    day.sx=day.sx.includes(s)?day.sx.filter(x=>x!==s):[...day.sx,s];save();return}
  if(t.dataset.w){day.water.push(+t.dataset.w);save()}
  else if(t.id==='wundo'){day.water.pop();save()}
  else if(t.dataset.f){day.items.push(JSON.parse(t.dataset.f));save()}
  else if(t.dataset.i!==undefined&&t.classList.contains('del')&&!t.classList.contains('dl')){day.items.splice(+t.dataset.i,1);save()}
  else if(t.dataset.h){day.habits[t.dataset.h]=!day.habits[t.dataset.h];save()}
  else if(t.dataset.m!==undefined){logs.splice(+t.dataset.m,1);await S.set('wl:measures',logs);render()}
  else if(t.id==='prev'){cur.setDate(cur.getDate()-1);load()}
  else if(t.id==='next'){cur.setDate(cur.getDate()+1);load()}
  else if(t.id==='cadd'){
    if(!cn.value.trim())return;
    day.items.push([cn.value.trim(),+ck.value||0,+cp.value||0,0]);
    cn.value=ck.value=cp.value='';save()}
  else if(t.id==='msave'){
    if(!mw.value&&!ms.value&&!mf.value&&!mm.value)return;
    logs.unshift({d:cur.toISOString().slice(0,10),w:mw.value,s:ms.value,f:mf.value,m:mm.value});
    await S.set('wl:measures',logs);
    mw.value=ms.value=mf.value=mm.value='';render()}
});
/* 匯出／匯入 */
function showMode(){
  smode.textContent=MODE==='cloud'
    ?'資料存在你的 Claude 帳號，換裝置登入同一個帳號還在。'
    :MODE==='local'
      ?'資料存在這台裝置的瀏覽器。換手機、清快取、或 iPhone Safari 超過 7 天沒開，都會清掉 —— 每週量體重時順手匯出一份。'
      :'目前無法儲存，重整就會消失。請下載檔案後用瀏覽器開啟。';
}
exp.onclick=async()=>{
  const ks=await S.keys(), data={};
  for(const k of ks)data[k]=await S.get(k);
  const blob=new Blob([JSON.stringify({v:1,at:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`減重紀錄-${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(a.href);
  bmsg.textContent='已匯出。建議存到雲端硬碟或傳給自己的 LINE。';
};
imp.onclick=()=>fin.click();
fin.onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  try{
    const j=JSON.parse(await f.text());
    if(!j.data)throw 0;
    let n=0;
    for(const [k,v] of Object.entries(j.data)){if(v!==null){await S.set(k,v);n++}}
    bmsg.textContent=`已匯入 ${n} 筆紀錄（${(j.at||'').slice(0,10)} 的備份）。同一天的紀錄會被備份檔覆蓋。`;
    await load();showMode();
  }catch(err){bmsg.textContent='這個檔案讀不出來。請選擇本工具匯出的 .json 備份檔。'}
  fin.value='';
};
load().then(showMode);
</script>
